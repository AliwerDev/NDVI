name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        # Throwaway database for CI only. These are not real credentials.
        env:
          POSTGRES_USER: ndvi
          POSTGRES_PASSWORD: ndvi
          POSTGRES_DB: ndvi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ndvi -d ndvi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ndvi:ndvi@localhost:5432/ndvi_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
