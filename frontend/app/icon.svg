<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Transparent background, so the leaf fits light and dark browser tabs.
       The leaf fills the whole icon, so it stays readable at 16 px. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .darkest { fill: #2fae5f; }
    }
  </style>
  <defs>
    <clipPath id="leaf">
      <path d="M4 60C4 28 28 4 60 4C60 36 36 60 4 60Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#leaf)">
    <rect x="5" y="5" width="16.67" height="16.67" fill="#66bd63"/>
    <rect x="23.67" y="5" width="16.67" height="16.67" fill="#1a9850"/>
    <rect class="darkest" x="42.33" y="5" width="16.67" height="16.67" fill="#006837"/>
    <rect x="5" y="23.67" width="16.67" height="16.67" fill="#a6d96a"/>
    <rect x="23.67" y="23.67" width="16.67" height="16.67" fill="#66bd63"/>
    <rect x="42.33" y="23.67" width="16.67" height="16.67" fill="#1a9850"/>
    <rect x="5" y="42.33" width="16.67" height="16.67" fill="#fee08b"/>
    <rect x="23.67" y="42.33" width="16.67" height="16.67" fill="#a6d96a"/>
    <rect x="42.33" y="42.33" width="16.67" height="16.67" fill="#66bd63"/>
  </g>
</svg>
