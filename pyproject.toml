[project]
name = "ndvi-field-monitor"
version = "0.1.0"
description = "Field monitoring service: Sentinel-2 NDVI for farm fields"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.17",
    "alembic>=1.14",
    "shapely>=2.0",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rasterio>=1.4",
    "numpy>=2.0",
    "apscheduler>=3.10,<4",
    "aiogram>=3.13",
    # HTTP client for the Open-Meteo weather API.
    "httpx>=0.27",
    # Time zone data for Asia/Tashkent; the slim Docker image has no system time zone files.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# This is an application, not a library, so uv does not build or install it as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
