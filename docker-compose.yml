services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    ports:
      # Host port comes from .env so it does not clash with other local Postgres containers.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes $ so the variable is read inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Development only: code changes on the host reload the server.
      - ./app:/code/app
      # New migration files created in the container appear on the host.
      - ./alembic:/code/alembic
      # NDVI COG files are saved here and are visible on the host.
      - ./data:/code/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  scheduler:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./data:/code/data
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    command: ["python", "-m", "app.bot"]
    # Without TELEGRAM_BOT_TOKEN the bot exits with code 0, and "on-failure" does not restart it.
    restart: on-failure

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      # Windows bind mounts do not send file events, so Next.js polls for changes.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the Linux node_modules and the build cache from the image, not the host folders.
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
